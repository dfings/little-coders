<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Coders</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<style>
:root{
  --bg:#f3f0ff; --ink:#2b2350; --soft:#6b6490; --card:#fff; --line:#e3ddfb;
  --brand:#7c4dff; --brand2:#ff5fa2; --coin:#ffb703; --ok:#22c55e; --bad:#ef4444;
  --ev:#f5a700; --mk:#a855f7; --mv:#3b82f6; --gm:#16a34a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded","Nunito","Baloo 2","Comic Sans MS",system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0 0 .4em;line-height:1.15}
.hidden{display:none!important}
.grow{flex:1}

/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;color:#fff;
  background:linear-gradient(100deg,var(--brand),var(--brand2));box-shadow:0 3px 0 rgba(0,0,0,.12)}
.logo{font-weight:900;font-size:22px;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:800;padding:8px 14px;border-radius:999px}
nav button.on{background:#fff;color:var(--brand)}
.coins{background:#fff;color:var(--ink);font-weight:900;padding:6px 14px;border-radius:999px;display:flex;gap:6px;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.coins.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25) rotate(-4deg)}}
.me{font-weight:800;white-space:nowrap}
.iconbtn{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:36px;height:36px;font-size:16px}

main{max-width:1280px;margin:0 auto;padding:18px 16px 40px}
footer{text-align:center;color:var(--soft);font-size:13px;padding:0 16px 30px}
footer button{border:0;background:none;color:var(--brand);text-decoration:underline;padding:0}

/* buttons */
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:800;background:var(--brand);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.pink{background:var(--brand2)} .btn.green{background:var(--ok)} .btn.gold{background:var(--coin);color:#3d2c00}
.btn.ghost{background:#fff;color:var(--brand);box-shadow:0 4px 0 var(--line)}
.btn.red{background:var(--bad)}
.btn.small{padding:6px 10px;border-radius:10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#eee9ff;color:var(--brand)}
.chip.green{background:#dcfce7;color:#15803d}.chip.gold{background:#fff1c9;color:#8a5a00}.chip.pink{background:#ffe1ee;color:#c2185b}

/* home */
.hero{background:var(--card);border-radius:28px;padding:28px;box-shadow:0 6px 0 var(--line);display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:clamp(28px,4.5vw,46px)}
.hero p{color:var(--soft);font-size:18px;margin:.2em 0 1em;max-width:36em}
.hero .big{font-size:96px;line-height:1}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:18px 0}
.step{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 5px 0 var(--line)}
.step .e{font-size:40px}
.step p{margin:0;color:var(--soft)}

/* cards */
.sect{display:flex;align-items:center;gap:10px;margin:22px 0 12px;flex-wrap:wrap}
.sect h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border-radius:22px;box-shadow:0 5px 0 var(--line);overflow:hidden;display:flex;flex-direction:column}
.card .art{height:110px;display:grid;place-items:center;font-size:62px;background:linear-gradient(135deg,#e9e2ff,#ffe3f0)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:18px;overflow-wrap:anywhere}
.card .by{color:var(--soft);font-size:14px}
.card .desc{color:var(--soft);font-size:14px;flex:1}
.card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card.new{border:3px dashed #c9bdfc;background:transparent;box-shadow:none;align-items:center;justify-content:center;min-height:230px;font-weight:900;color:var(--brand);font-size:18px;cursor:pointer;gap:6px}
.card.new .e{font-size:48px}
.price{font-weight:900}
.empty{color:var(--soft);background:#fff;border-radius:18px;padding:18px;border:2px dashed var(--line)}

/* editor */
.ed-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ed-top .title{font-weight:900;font-size:20px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0;width:240px;background:#fff}
.iconsel{font-size:22px;border:2px solid var(--line);border-radius:12px;padding:5px;background:#fff}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:0 4px 0 var(--line)}
.seg button{border:0;background:none;padding:7px 12px;border-radius:10px;font-weight:800;color:var(--soft)}
.seg button.on{background:var(--brand);color:#fff}
.ed{display:grid;grid-template-columns:250px minmax(0,1fr) 400px;gap:12px;align-items:start}
.panel{background:var(--card);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:12px}
.pal{max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:76px}
.pal h4{margin:10px 0 6px;font-size:14px}
.pal h4:first-child{margin-top:0}
.ws{min-height:480px}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:10px}
@media (max-width:1050px){
  .ed{grid-template-columns:220px minmax(0,1fr)}
  .side{grid-column:1/-1;grid-row:1;position:static;max-width:520px;width:100%;margin:0 auto}
}
@media (max-width:640px){
  .ed{grid-template-columns:1fr}
  .pal{position:static;max-height:260px}
}

/* blocks */
.blk{--c:var(--mk);display:flex;flex-wrap:wrap;align-items:center;gap:5px;background:var(--c);color:#fff;font-weight:800;font-size:14px;
  padding:6px 8px;border-radius:10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);margin:0 0 5px}
.c-events{--c:var(--ev)} .c-make{--c:var(--mk)} .c-motion{--c:var(--mv)} .c-game{--c:var(--gm)}
.pal .blk{cursor:grab;user-select:none}
.pal .blk:hover{filter:brightness(1.08)}
.pal .blk i{font-style:normal;background:rgba(255,255,255,.3);border-radius:6px;padding:0 5px}
.blk.hat{border-radius:16px 16px 10px 10px;padding:8px 10px;margin:0}
.f{border:0;border-radius:7px;padding:2px 5px;background:#fff;color:var(--ink);font-weight:800;font-size:14px;height:26px}
.f.num{width:58px}.f.nm{width:74px}.f.txt{width:150px}
select.f{padding:2px}
.tools{margin-left:auto;display:flex;gap:2px}
.tools button,.handle{border:0;background:rgba(0,0,0,.18);color:#fff;border-radius:6px;width:22px;height:22px;font-size:11px;padding:0;line-height:1}
.handle{cursor:grab;display:grid;place-items:center}
.script{border:3px solid transparent;border-radius:20px;padding:6px;margin-bottom:10px;background:#f7f5ff}
.script.sel{border-color:var(--brand);background:#efeaff}
.sbody{padding:6px 0 0 14px;margin-left:8px;border-left:5px solid rgba(0,0,0,.08);min-height:34px}
.sbody .blk.dropb{box-shadow:0 -4px 0 var(--brand2),inset 0 -3px 0 rgba(0,0,0,.18)}
.sbody.drope{box-shadow:inset 0 -4px 0 var(--brand2)}
.sbody .tip{color:var(--soft);font-size:13px;padding:4px}
.ws-hint{color:var(--soft);font-size:14px;margin:0 0 10px}

/* code mode */
#codeBox{width:100%;min-height:520px;border:0;outline:0;resize:vertical;background:#1e1b36;color:#e9e6ff;border-radius:14px;padding:14px;
  font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto}
.snip{display:block;width:100%;text-align:left;border:0;background:#f1edff;border-radius:8px;padding:5px 8px;margin-bottom:4px;
  font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.snip:hover{background:#e2dbff}
pre.peek{margin:8px 0 0;background:#1e1b36;color:#e9e6ff;border-radius:12px;padding:10px;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;max-height:280px;overflow:auto;white-space:pre}
details summary{cursor:pointer;font-weight:800}

/* stage */
.stage{position:relative;border-radius:16px;overflow:hidden;background:#111;box-shadow:0 5px 0 var(--line);aspect-ratio:4/3}
.stage canvas{width:100%;height:100%;display:block;touch-action:none}
.s-over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(20,10,60,.72);color:#fff;text-align:center;padding:16px}
.s-over.show{display:flex}
.s-over .big{font-size:34px;font-weight:900}
.pad{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.pad button{border:0;background:#fff;box-shadow:0 4px 0 var(--line);border-radius:12px;width:48px;height:42px;font-size:18px;font-weight:900;color:var(--brand);touch-action:none;user-select:none}
.pad button.wide{width:90px;font-size:13px}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{color:var(--soft);font-size:13px}

/* modal + toast */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(30,20,80,.55);display:grid;place-items:center;padding:14px;overflow:auto}
.modal{background:#fff;border-radius:26px;padding:22px;max-width:480px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:pop .2s}
.modal.wide{max-width:560px}
.modal .big{font-size:64px;text-align:center;line-height:1.1}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.modal label{display:block;font-weight:800;margin:12px 0 4px}
.modal input[type=text],.modal textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:9px 10px}
.modal input[type=range]{width:100%}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.avatars{display:flex;flex-wrap:wrap;gap:6px}
.avatars button{font-size:26px;width:46px;height:46px;border-radius:14px;border:3px solid transparent;background:#f1edff}
.avatars button.on{border-color:var(--brand);background:#fff}
#toasts{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-weight:800;padding:10px 14px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:pop .25s;max-width:320px}
</style>
</head>
<body>
<header>
  <div class="logo" data-a="go" data-v="home">🧩 Little Coders</div>
  <nav id="nav">
    <button data-a="go" data-v="make">🛠️ Make</button>
    <button data-a="go" data-v="shop">🛒 Game Shop</button>
    <button data-a="go" data-v="inv">🎒 My Games</button>
  </nav>
  <span class="grow"></span>
  <span class="me" id="me"></span>
  <div class="coins" id="coins" title="Your coins">🪙 <span id="coinN">0</span></div>
  <button class="iconbtn" data-a="mute" id="muteBtn" title="Sound on/off">🔊</button>
</header>
<main id="app"></main>
<footer>
  Demo mode: the coins, the shop and the other coders are all pretend, and everything is saved only in this browser.
  <button data-a="reset">Start the demo over</button>
</footer>
<div id="toasts"></div>

<script>
'use strict';
/* ============================================================
   Little Coders — a single-page mock-up.
   No server: everything lives in localStorage, and the "other
   players" who publish and buy games are simulated.
   ============================================================ */

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q = s => "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ') + "'";
const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };

/* ---------------- game engine ---------------- */
const W = 480, H = 360;
const DIRS = {left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1]};
const KEYMAP = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', ' ':'space',
                a:'left', d:'right', w:'up', s:'down', A:'left', D:'right', W:'up', S:'down'};
let activeEngine = null;
let audioCtx = null;

function beep(kind) {
  if (S.muted) return;
  const seqs = {
    pop: [[620, .08]], coin: [[880, .07], [1320, .12]], boom: [[110, .3, 'sawtooth']], jump: [[380, .06], [620, .1]],
    win: [[523, .1], [659, .1], [784, .1], [1047, .25]], lose: [[300, .15], [190, .3]]
  };
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    let t = audioCtx.currentTime;
    for (const [freq, dur, type] of seqs[kind] || seqs.pop) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(.07, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur);
      t += dur;
    }
  } catch (e) { /* no sound available */ }
}

class Engine {
  constructor(canvas, onEnd, onError) {
    this.cv = canvas; this.g = canvas.getContext('2d');
    this.onEnd = onEnd; this.onError = onError;
    this.sprites = []; this.nextId = 1; this.bg = '#8fd3ff';
    this.keyH = []; this.foreverH = []; this.everyH = []; this.touchH = []; this.tapH = [];
    this.held = new Set(); this.touching = new Set(); this.ctx = null;
    this.scoreV = 0; this.time = 0; this.msg = ''; this.msgT = 0;
    this.running = false; this.ended = false;
  }

  load(code) {
    const api = this.api();
    try {
      // The extra { } lets kids reuse names like "score" for their own variables.
      new Function(...Object.keys(api), '"use strict";{\n' + code + '\n}')(...Object.values(api));
    } catch (e) { this.fail(e); return false; }
    return !this.failed;
  }

  api() {
    const E = this;
    const grp = name => {
      if (E.ctx && E.ctx[name]) return E.ctx[name].dead ? [] : [E.ctx[name]];
      return E.sprites.filter(s => s.name === name && !s.dead);
    };
    const clamp = s => {
      s.x = Math.max(s.size / 2, Math.min(W - s.size / 2, s.x));
      s.y = Math.max(s.size / 2, Math.min(H - s.size / 2, s.y));
    };
    const random = (a, b) => { a = Math.ceil(a); b = Math.floor(b); return Math.floor(Math.random() * (b - a + 1)) + a; };
    const make = (emoji, name, x = W / 2, y = H / 2, size = 40) => {
      const s = {id: E.nextId++, emoji: String(emoji), name: String(name), x: +x || 0, y: +y || 0, size: +size || 40,
                 vx: 0, vy: 0, bouncy: false, dead: false, remove() { this.dead = true; }};
      if (E.sprites.length < 150) E.sprites.push(s);
      return s;
    };
    return {
      WIDTH: W, HEIGHT: H, random, make,
      background: c => { E.bg = String(c); },
      makeMany: (count, emoji, name) => { for (let i = 0; i < Math.min(50, count); i++) make(emoji, name, random(30, W - 30), random(30, H - 30)); },
      move: (name, dir, steps = 5) => { const d = DIRS[dir] || [0, 0]; grp(name).forEach(s => { s.x += d[0] * steps; s.y += d[1] * steps; clamp(s); }); },
      goTo: (name, x, y) => grp(name).forEach(s => { s.x = +x; s.y = +y; }),
      goRandom: name => grp(name).forEach(s => { s.x = random(30, W - 30); s.y = random(30, H - 30); }),
      glide: (name, dir, speed = 2) => grp(name).forEach(s => {
        const a = Math.random() * Math.PI * 2, d = DIRS[dir] || [Math.cos(a), Math.sin(a)];
        s.vx = d[0] * speed; s.vy = d[1] * speed;
      }),
      stop: name => grp(name).forEach(s => { s.vx = s.vy = 0; }),
      bounce: name => grp(name).forEach(s => { s.bouncy = true; }),
      follow: (name, target, speed = 1) => {
        const t = grp(target)[0]; if (!t) return;
        grp(name).forEach(s => { const dx = t.x - s.x, dy = t.y - s.y, d = Math.hypot(dx, dy); if (d > 1) { s.x += dx / d * speed; s.y += dy / d * speed; } });
      },
      setSize: (name, size) => grp(name).forEach(s => { s.size = Math.max(8, Math.min(200, +size || 40)); }),
      remove: name => grp(name).forEach(s => { s.dead = true; }),
      all: name => grp(name),
      count: name => grp(name).length,
      changeScore: by => { E.scoreV += +by || 0; },
      setScore: v => { E.scoreV = +v || 0; },
      score: () => E.scoreV,
      timer: () => E.time,
      say: text => { E.msg = String(text); E.msgT = 2.5; },
      sound: kind => beep(kind),
      win: () => E.end('win'),
      gameOver: () => E.end('lose'),
      whenKey: (key, fn) => E.keyH.push({key, fn}),
      forever: fn => E.foreverH.push(fn),
      every: (secs, fn) => E.everyH.push({secs: Math.max(.05, +secs || 1), fn, t: 0}),
      whenTouch: (a, b, fn) => E.touchH.push({a, b, fn}),
      whenTapped: (name, fn) => E.tapH.push({name, fn}),
    };
  }

  call(fn, ctx) {
    if (this.ended) return;
    this.ctx = ctx || null;
    try { fn(); } catch (e) { this.fail(e); }
    this.ctx = null;
  }

  fail(e) {
    this.failed = true; this.stop();
    this.onError && this.onError(e && e.message ? e.message : String(e));
  }

  end(result) {
    if (this.ended) return;
    this.ended = true; this.running = false;
    this.draw();
    beep(result === 'win' ? 'win' : 'lose');
    this.onEnd && this.onEnd(result, this.scoreV);
  }

  start() {
    this.running = true; activeEngine = this;
    let last = performance.now(), acc = 0;
    const loop = t => {
      if (!this.running) return;
      acc += Math.min(100, t - last); last = t;
      while (acc >= 16.6 && this.running) { this.step(); acc -= 16.6; }
      this.draw();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    this.draw();
  }

  stop() { this.running = false; this.held.clear(); if (activeEngine === this) activeEngine = null; }

  step() {
    this.time += 1 / 60;
    if (this.msgT > 0) this.msgT -= 1 / 60;
    for (const h of this.keyH) if (this.held.has(h.key)) this.call(h.fn);
    for (const fn of this.foreverH) this.call(fn);
    for (const h of this.everyH) { h.t += 1 / 60; if (h.t >= h.secs) { h.t -= h.secs; this.call(h.fn); } }
    for (const s of this.sprites) {
      if (!s.vx && !s.vy) continue;
      s.x += s.vx; s.y += s.vy;
      const r = s.size / 2;
      if (s.bouncy) {
        if (s.x < r) { s.x = r; s.vx = Math.abs(s.vx); } else if (s.x > W - r) { s.x = W - r; s.vx = -Math.abs(s.vx); }
        if (s.y < r) { s.y = r; s.vy = Math.abs(s.vy); } else if (s.y > H - r) { s.y = H - r; s.vy = -Math.abs(s.vy); }
      } else {
        if (s.x < -r) s.x = W + r; else if (s.x > W + r) s.x = -r;
        if (s.y < -r) s.y = H + r; else if (s.y > H + r) s.y = -r;
      }
    }
    // "touches" fires once each time two things start overlapping
    const now = new Set();
    this.touchH.forEach((h, i) => {
      const As = this.sprites.filter(s => s.name === h.a), Bs = this.sprites.filter(s => s.name === h.b);
      for (const a of As) for (const b of Bs) {
        if (a === b || a.dead || b.dead) continue;
        if (Math.hypot(a.x - b.x, a.y - b.y) < (a.size + b.size) * .42) {
          const k = i + ':' + a.id + ':' + b.id;
          now.add(k);
          if (!this.touching.has(k)) this.call(h.fn, {[h.b]: b, [h.a]: a});
        }
      }
    });
    this.touching = now;
    this.sprites = this.sprites.filter(s => !s.dead);
  }

  tap(x, y) {
    if (!this.running) return;
    for (let i = this.sprites.length - 1; i >= 0; i--) {
      const s = this.sprites[i];
      if (!s.dead && Math.hypot(s.x - x, s.y - y) < Math.max(22, s.size * .6)) {
        const hs = this.tapH.filter(h => h.name === s.name);
        if (hs.length) { hs.forEach(h => this.call(h.fn, {[s.name]: s})); return; }
      }
    }
  }

  draw() {
    const g = this.g;
    g.setTransform(this.cv.width / W, 0, 0, this.cv.height / H, 0, 0);
    try { g.fillStyle = '#8fd3ff'; g.fillStyle = this.bg; } catch (e) {}
    g.fillRect(0, 0, W, H);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const s of this.sprites) {
      if (s.dead) continue;
      g.font = s.size + 'px serif';
      g.fillText(s.emoji, s.x, s.y + s.size * .06);
    }
    g.font = '900 18px system-ui, sans-serif'; g.textAlign = 'left'; g.lineJoin = 'round';
    g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.55)'; g.fillStyle = '#fff';
    g.strokeText('⭐ ' + this.scoreV, 10, 18); g.fillText('⭐ ' + this.scoreV, 10, 18);
    if (this.msgT > 0 && this.msg) {
      g.font = '800 16px system-ui, sans-serif'; g.textAlign = 'center';
      const w = Math.min(W - 20, g.measureText(this.msg).width + 28);
      g.fillStyle = 'rgba(255,255,255,.94)';
      g.beginPath(); g.roundRect ? g.roundRect(W / 2 - w / 2, H - 46, w, 32, 14) : g.rect(W / 2 - w / 2, H - 46, w, 32); g.fill();
      g.fillStyle = '#2b2350'; g.fillText(this.msg, W / 2, H - 29, W - 40);
    }
  }
}

/* A stage = canvas + win/lose overlay + on-screen buttons (for tablets). */
function makeStage(host, opt = {}) {
  host.innerHTML = `
    <div class="stage"><canvas width="${W * 2}" height="${H * 2}"></canvas><div class="s-over"></div></div>
    <div class="pad">
      <button data-k="left">◀</button><button data-k="up">▲</button><button data-k="down">▼</button><button data-k="right">▶</button>
      <button data-k="space" class="wide">SPACE</button>
    </div>`;
  const cv = $('canvas', host), over = $('.s-over', host);
  let eng = null, lastCode = '';
  const show = html => { over.innerHTML = html; over.classList.add('show'); };
  const stage = {
    run(code) {
      stage.stop(); lastCode = code; over.classList.remove('show');
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      eng = new Engine(cv,
        (result, score) => {
          show(`<div class="big">${result === 'win' ? '🎉 You win!' : '💥 Game over'}</div><div>Score: ${score}</div><button class="btn gold" data-again>🔁 Play again</button>`);
          opt.onEnd && opt.onEnd(result, score);
        },
        msg => show(`<div class="big">🐛 Uh oh, a bug!</div><div>${esc(msg)}</div><div class="hint" style="color:#ddd">Check your code and try again.</div>`));
      if (eng.load(code)) eng.start();
    },
    stop() { if (eng) { eng.stop(); eng = null; } },
    idle() {
      stage.stop(); over.classList.remove('show');
      const g = cv.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0);
      g.fillStyle = '#2b2350'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '900 24px system-ui, sans-serif'; g.fillText('▶  Press Play to try your game', W / 2, H / 2);
    }
  };
  over.addEventListener('click', e => { if (e.target.closest('[data-again]')) stage.run(lastCode); });
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    if (eng) eng.tap((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
  });
  const pad = $('.pad', host);
  const press = (e, on) => { const b = e.target.closest('[data-k]'); if (b && eng) { on ? eng.held.add(b.dataset.k) : eng.held.delete(b.dataset.k); e.preventDefault(); } };
  pad.addEventListener('pointerdown', e => press(e, true));
  ['pointerup', 'pointerleave', 'pointercancel', 'pointerout'].forEach(t => pad.addEventListener(t, e => press(e, false)));
  return stage;
}

          ['white', '⬜ white'], ['midnightblue', '🌌 night'], ['black', '⬛ space']],
  sound: [['pop', 'pop'], ['coin', 'coin'], ['jump', 'jump'], ['boom', 'boom']],

};
const CATS = [['events', '⚡ When…'], ['make', '🎨 Make'], ['motion', '🏃 Move'], ['game', '🏆 Game']];
const wrapFn = (head, body) => head + '() => {\n' + body.map(l => '  ' + l).join('\n') + '\n});';
const ref = (k, i) => ({k, t: 'ref', i});

const BLOCKS = {
  // "hat" blocks start a script
  start:   {hat: 1, cat: 'events', parts: ['🏁 when the game starts'], wrap: (a, b) => '// when the game starts\n' + b.join('\n')},
  key:     {hat: 1, cat: 'events', parts: ['⌨️ when', {k: 'key', t: 'key', d: 'left'}, 'key is pressed'], wrap: (a, b) => wrapFn(`whenKey(${q(a.key)}, `, b)},
  touch:   {hat: 1, cat: 'events', parts: ['💥 when', ref('a', 0), 'touches', ref('b', 1)], wrap: (a, b) => wrapFn(`whenTouch(${q(a.a)}, ${q(a.b)}, `, b)},
  tap:     {hat: 1, cat: 'events', parts: ['👆 when', ref('a', 0), 'is tapped'], wrap: (a, b) => wrapFn(`whenTapped(${q(a.a)}, `, b)},

  every:   {hat: 1, cat: 'events', parts: ['⏱️ every', {k: 'secs', t: 'num', d: 1}, 'seconds'], wrap: (a, b) => wrapFn(`every(${n(a.secs)}, `, b)},

  background: {cat: 'make', parts: ['paint the background', {k: 'color', t: 'color', d: 'skyblue'}], gen: a => `background(${q(a.color)});`},
  make:     {cat: 'make', parts: ['make', {k: 'emoji', t: 'emoji', d: '🐱'}, 'named', {k: 'name', t: 'new', d: 'cat'}, 'at x', {k: 'x', t: 'num', d: 240}, 'y', {k: 'y', t: 'num', d: 180}],
             gen: a => `make(${q(a.emoji)}, ${q(a.name)}, ${n(a.x)}, ${n(a.y)});`},
  makeMany: {cat: 'make', parts: ['make', {k: 'count', t: 'num', d: 5}, {k: 'emoji', t: 'emoji', d: '⭐'}, 'named', {k: 'name', t: 'new', d: 'star'}, 'in random spots'],
             gen: a => `makeMany(${n(a.count)}, ${q(a.emoji)}, ${q(a.name)});`},
  setSize:  {cat: 'make', parts: ['set size of', ref('a', 0), 'to', {k: 'size', t: 'num', d: 60}], gen: a => `setSize(${q(a.a)}, ${n(a.size)});`},
  remove:   {cat: 'make', parts: ['remove', ref('a', 0)], gen: a => `remove(${q(a.a)});`},

  move:     {cat: 'motion', parts: ['move', ref('a', 0), {k: 'dir', t: 'dir', d: 'right'}, 'by', {k: 'steps', t: 'num', d: 5}], gen: a => `move(${q(a.a)}, ${q(a.dir)}, ${n(a.steps)});`},
  goTo:     {cat: 'motion', parts: ['send', ref('a', 0), 'to x', {k: 'x', t: 'num', d: 240}, 'y', {k: 'y', t: 'num', d: 180}], gen: a => `goTo(${q(a.a)}, ${n(a.x)}, ${n(a.y)});`},
  goRandom: {cat: 'motion', parts: ['send', ref('a', 0), 'to a random spot'], gen: a => `goRandom(${q(a.a)});`},
  glide:    {cat: 'motion', parts: ['make', ref('a', 0), 'glide', {k: 'dir', t: 'dirR', d: 'down'}, 'at speed', {k: 'speed', t: 'num', d: 2}], gen: a => `glide(${q(a.a)}, ${q(a.dir)}, ${n(a.speed)});`},
  bounce:   {cat: 'motion', parts: ['make', ref('a', 0), 'bounce off the walls'], gen: a => `bounce(${q(a.a)});`},
  follow:   {cat: 'motion', parts: ['move', ref('a', 1), 'toward', ref('b', 0), 'at speed', {k: 'speed', t: 'num', d: 1}], gen: a => `follow(${q(a.a)}, ${q(a.b)}, ${n(a.speed)});`},
  stop:     {cat: 'motion', parts: ['stop', ref('a', 0)], gen: a => `stop(${q(a.a)});`},

  changeScore: {cat: 'game', parts: ['change score by', {k: 'by', t: 'num', d: 1}], gen: a => `changeScore(${n(a.by)});`},
  say:      {cat: 'game', parts: ['say', {k: 'text', t: 'text', d: 'Hello!'}], gen: a => `say(${q(a.text)});`},
  sound:    {cat: 'game', parts: ['play sound', {k: 'kind', t: 'sound', d: 'pop'}], gen: a => `sound(${q(a.kind)});`},
  ifScore:  {cat: 'game', parts: ['if score reaches', {k: 'score', t: 'num', d: 10}, '→', {k: 'end', t: 'end', d: 'win'}], gen: a => `if (score() >= ${n(a.score)}) ${endFn(a.end)}();`},
  ifTimer:  {cat: 'game', parts: ['if timer passes', {k: 'secs', t: 'num', d: 20}, 'seconds →', {k: 'end', t: 'end', d: 'gameOver'}], gen: a => `if (timer() >= ${n(a.secs)}) ${endFn(a.end)}();`},
  ifNone:   {cat: 'game', parts: ['if no', ref('a', 1), 'are left →', {k: 'end', t: 'end', d: 'win'}], gen: a => `if (count(${q(a.a)}) === 0) ${endFn(a.end)}();`},
  win:      {cat: 'game', parts: ['🎉 you win!'], gen: () => 'win();'},
  gameOver: {cat: 'game', parts: ['💥 game over'], gen: () => 'gameOver();'},
};
const endFn = v => v === 'gameOver' ? 'gameOver' : 'win';
const fields = type => BLOCKS[type].parts.filter(p => typeof p !== 'string');

let cur = null;            // the game open in the editor
let selScript = 0;         // which script new blocks get added to

function names() {
  const out = [];
  for (const s of (cur ? cur.scripts : [])) for (const b of s.blocks)
    for (const f of fields(b.type)) if (f.t === 'new' && b.args[f.k] && !out.includes(b.args[f.k])) out.push(b.args[f.k]);
  return out;
}
/* Build a block; values fill the fields in order, anything missing gets its default. */
function mk(type, ...vals) {
  const args = {}, ns = names();
  fields(type).forEach((f, i) => {
    args[f.k] = vals[i] !== undefined ? vals[i] : f.t === 'ref' ? (ns[f.i] || ns[0] || 'cat') : f.d;
  });
  return {type, args};
}
const sc = (hat, ...blocks) => ({hat, blocks});

function genCode(scripts) {
  return scripts.map(s => BLOCKS[s.hat.type].wrap(s.hat.args, s.blocks.map(b => BLOCKS[b.type].gen(b.args)))).join('\n\n');
}
const gameCode = g => g.mode === 'code' ? g.code : genCode(g.scripts);

function buyGame(g) {

      <p style="text-align:center">${esc(g.title)} costs ${g.price} 🪙 and you have ${S.coins} 🪙.<br>Finish a game of your own to earn ${FINISH_REWARD} 🪙!</p>

/* ---------------- making games ---------------- */
function newGame(from) {
  const g = {
    id: 'g' + S.nextId++, title: from ? from.title + ' remix' : 'My Game ' + (S.games.length + 1),
    icon: from ? from.icon : EMOJI[Math.floor(Math.random() * EMOJI.length)], desc: '',
    mode: from ? from.mode : 'blocks', code: from ? from.code || '' : '', codeEdited: !!(from && from.mode === 'code'),
    scripts: from ? JSON.parse(JSON.stringify(from.scripts || [])) : [
      sc(mk('start'), mk('background', 'skyblue'), mk('make', '🐱', 'cat', 240, 280), mk('make', '⭐', 'star', 240, 80), mk('say', 'Use the arrow keys!')),
      ...moveKeys('cat', 5),
    ],
    beaten: false, finished: false, published: false, price: 5, sales: 0, remixOf: from ? from.id : null,
  };
  S.games.push(g); save();
  cur = g; selScript = 0; go('editor');
}

function fieldHTML(f, v, path) {
  const at = `data-p="${path}" data-k="${f.k}" data-t="${f.t}"`;
  if (f.t === 'num') return `<input type="number" step="any" class="f num" ${at} value="${esc(v)}">`;
  if (f.t === 'text') return `<input type="text" maxlength="40" class="f txt" ${at} value="${esc(v)}">`;
  if (f.t === 'new') return `<input type="text" maxlength="12" class="f nm" ${at} value="${esc(v)}">`;
  let opts = f.t === 'ref' ? names().map(x => [x, x]) : OPTIONS[f.t];
  if (!opts.some(o => o[0] === v)) opts = [[v, v], ...opts];
  return `<select class="f" ${at}>${opts.map(o => `<option value="${esc(o[0])}" ${o[0] === v ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
}
function blockHTML(b, path, isHat) {
  const def = BLOCKS[b.type];
  const parts = def.parts.map(p => typeof p === 'string' ? `<span>${p}</span>` : fieldHTML(p, b.args[p.k], path)).join('');
  const tools = isHat ? `<span class="tools"><button data-w="delscript" data-p="${path}" title="Delete this whole stack">✖</button></span>`
    : `<span class="tools"><button data-w="up" data-p="${path}" title="Move up">▲</button><button data-w="down" data-p="${path}" title="Move down">▼</button><button data-w="del" data-p="${path}" title="Delete">✖</button></span>`;
  return `<div class="blk c-${def.cat} ${isHat ? 'hat' : ''}" data-p="${path}">${isHat ? '' : '<span class="handle" draggable="true" title="Drag me">⠿</span>'}${parts}${tools}</div>`;
}
function paletteHTML() {
  return CATS.map(([cat, label]) => `<h4>${label}</h4>` + Object.entries(BLOCKS).filter(([, d]) => d.cat === cat).map(([type, d]) =>
    `<div class="blk c-${cat}" draggable="true" data-new="${type}" title="Click or drag to add">${d.parts.map(p => {
      if (typeof p === 'string') return p;
      const o = OPTIONS[p.t] && OPTIONS[p.t].find(x => x[0] === p.d);
      return `<i>${esc(p.t === 'ref' ? 'who' : o ? o[1] : p.d)}</i>`;
    }).join(' ')}</div>`).join('')).join('');
}
const SNIPPETS = [
  ['Make things', ["background('skyblue');", "make('🐱', 'cat', 240, 180);", "makeMany(5, '⭐', 'star');", "setSize('cat', 60);", "remove('star');"]],
  ['Move things', ["move('cat', 'left', 5);", "goTo('cat', 240, 180);", "goRandom('star');", "glide('star', 'down', 2);", "bounce('star');", "follow('ghost', 'cat', 1);", "stop('star');"]],
  ['When…', ["whenKey('left', () => {\n  \n});", "whenTouch('cat', 'star', () => {\n  \n});", "whenTapped('star', () => {\n  \n});", "forever(() => {\n  \n});", "every(1, () => {\n  \n});"]],
  ['Game', ["changeScore(1);", "say('Hello!');", "sound('coin');", "if (score() >= 10) win();", "if (timer() >= 20) gameOver();", "if (count('star') === 0) win();", "random(1, 10)"]],
];

function renderEditor() {
  const g = cur;
  const reward = g.remixOf ? REMIX_REWARD : FINISH_REWARD;
  app.innerHTML = `
    <div class="ed-top">
      <button class="btn ghost small" data-a="go" data-v="make">← Workshop</button>
      <select id="gIcon" class="iconsel" title="Game picture">${[...new Set([g.icon, ...EMOJI])].map(e => `<option ${e === g.icon ? 'selected' : ''}>${e}</option>`).join('')}</select>
      <input id="gTitle" class="title" maxlength="30" value="${esc(g.title)}" title="Game name">
      <div class="seg"><button data-a="mode" data-m="blocks" class="${g.mode === 'blocks' ? 'on' : ''}">🧱 Blocks</button><button data-a="mode" data-m="code" class="${g.mode === 'code' ? 'on' : ''}">⌨️ Real code</button></div>
      <span class="grow"></span>
      ${g.finished ? '<span class="chip green">✅ Finished</span>' : `<button class="btn green" data-a="finish">✅ Finish game · +${reward} 🪙</button>`}
      <button class="btn pink" data-a="publish" ${g.finished ? '' : 'disabled title="Finish your game first"'}>${g.published ? '🚀 In the shop · change' : '🚀 Publish'}</button>
    </div>
    <div class="ed">
      <div class="panel pal" id="pal"></div>
      <div class="panel ws" id="ws"></div>
      <div class="side">
        <div id="edStage"></div>
        <div class="row">
          <button class="btn green" data-a="run">▶ Play</button>
          <button class="btn ghost" data-a="stoprun">⏹ Stop</button>
          <span class="hint" id="beatHint"></span>
        </div>
        <div class="panel" id="peekBox"></div>
      </div>
    </div>`;
  $('#gTitle').addEventListener('input', e => { g.title = e.target.value.trim() || 'My Game'; save(); });
  $('#gIcon').addEventListener('change', e => { g.icon = e.target.value; save(); });
  edStage = makeStage($('#edStage'), {onEnd: result => { if (result === 'win' && !g.beaten) { g.beaten = true; save(); beatHint(); } }});
  edStage.idle();
  beatHint();
  if (g.mode === 'blocks') {
    $('#pal').innerHTML = paletteHTML();
    $('#peekBox').innerHTML = `<details><summary>👀 Peek at the real code</summary><pre class="peek" id="peekCode"></pre>
      <div class="hint" style="margin-top:6px">This is what your blocks really say! Ready to type it yourself? Switch to <b>⌨️ Real code</b>.</div></details>`;
    bindWorkspace(); renderWorkspace();
  } else {
    $('#pal').innerHTML = `<div class="hint" style="margin-bottom:6px">Click to add to your code:</div>` + SNIPPETS.map(([h, list]) =>
      `<h4>${h}</h4>` + list.map(s => `<button class="snip" data-snip="${esc(s)}">${esc(s.split('\n')[0])}</button>`).join('')).join('');
    $('#ws').innerHTML = `<textarea id="codeBox" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>`;
    $('#peekBox').innerHTML = `<div class="hint">You are writing real JavaScript! The stage is 480 wide and 360 tall. x goes across, y goes down.</div>`;
    const box = $('#codeBox'); box.value = g.code;
    const insert = text => {
      const a = box.selectionStart, b = box.selectionEnd;
      box.setRangeText(text, a, b, 'end'); box.focus(); g.code = box.value; g.codeEdited = true; save();
    };
    box.addEventListener('input', () => { g.code = box.value; g.codeEdited = true; save(); });
    box.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); insert('  '); } });
    $('#pal').addEventListener('click', e => { const s = e.target.closest('[data-snip]'); if (s) insert(s.dataset.snip + '\n'); });
  }
}
function beatHint() {
  const el = $('#beatHint'); if (!el || !cur) return;
  el.textContent = cur.finished ? '' : cur.beaten ? '🏆 You beat it! Now press Finish.' : 'Win your game once to finish it.';
}

function renderWorkspace() {
  const g = cur, ws = $('#ws');
  if (selScript >= g.scripts.length) selScript = g.scripts.length - 1;
  ws.innerHTML = `<p class="ws-hint">Click a block on the left to add it to the stack with the purple outline, or drag it where you want it.</p>` +
    (g.scripts.length ? '' : '<div class="empty">No blocks yet. Start with a yellow <b>⚡ When…</b> block.</div>') +
    g.scripts.map((s, si) => `<div class="script ${si === selScript ? 'sel' : ''}" data-si="${si}">
      ${blockHTML(s.hat, String(si), true)}
      <div class="sbody" data-si="${si}">${s.blocks.map((b, bi) => blockHTML(b, si + '.' + bi)).join('') || '<div class="tip">Add blocks here</div>'}</div>
    </div>`).join('');
  refreshPeek();
}
function refreshPeek() { const p = $('#peekCode'); if (p && cur) p.textContent = genCode(cur.scripts); }
const blockAt = path => { const [si, bi] = path.split('.').map(Number); return bi === undefined ? cur.scripts[si].hat : cur.scripts[si].blocks[bi]; };

let drag = null;
function bindWorkspace() {
  const ws = $('#ws'), pal = $('#pal');
  const addNew = (type, si, at) => {
    if (BLOCKS[type].hat) { cur.scripts.push(sc(mk(type))); selScript = cur.scripts.length - 1; }
    else {
      if (!cur.scripts.length) { cur.scripts.push(sc(mk('start'))); selScript = 0; }
      const s = cur.scripts[si === undefined ? selScript : si];
      s.blocks.splice(at === undefined ? s.blocks.length : at, 0, mk(type));
      if (si !== undefined) selScript = si;
    }
    save(); renderWorkspace();
  };
  pal.addEventListener('click', e => { const b = e.target.closest('[data-new]'); if (b) addNew(b.dataset.new); });
  pal.addEventListener('dragstart', e => { const b = e.target.closest('[data-new]'); if (b) { drag = {type: b.dataset.new}; e.dataTransfer.setData('text/plain', b.dataset.new); } });
  pal.addEventListener('dragend', () => { drag = null; clearMarks(); });

  ws.addEventListener('input', e => {
    const f = e.target.closest('.f'); if (!f) return;
    blockAt(f.dataset.p).args[f.dataset.k] = f.dataset.t === 'new' ? f.value.replace(/['"\\]/g, '') : f.value;
    save(); refreshPeek();
  });
  // a renamed character has to show up in every "who" menu
  ws.addEventListener('change', e => { if (e.target.dataset.t === 'new') renderWorkspace(); });
  ws.addEventListener('click', e => {
    const t = e.target.closest('[data-w]'), scr = e.target.closest('.script');
    if (t) {
      const [si, bi] = t.dataset.p.split('.').map(Number), list = cur.scripts[si].blocks;
      if (t.dataset.w === 'delscript') cur.scripts.splice(si, 1);
      else if (t.dataset.w === 'del') list.splice(bi, 1);
      else { const to = bi + (t.dataset.w === 'up' ? -1 : 1); if (to >= 0 && to < list.length) [list[bi], list[to]] = [list[to], list[bi]]; }
      save(); renderWorkspace();
    } else if (scr && +scr.dataset.si !== selScript && !e.target.closest('.f')) {
      selScript = +scr.dataset.si;
      ws.querySelectorAll('.script').forEach(x => x.classList.toggle('sel', +x.dataset.si === selScript));
    }
  });

  const clearMarks = () => ws.querySelectorAll('.dropb,.drope').forEach(x => x.classList.remove('dropb', 'drope'));
  const dropIndex = (body, y) => {
    const kids = [...body.querySelectorAll(':scope > .blk')];
    const i = kids.findIndex(k => { const r = k.getBoundingClientRect(); return y < r.top + r.height / 2; });
    return {kids, i: i < 0 ? kids.length : i};
  };
  ws.addEventListener('dragstart', e => {
    const h = e.target.closest('.handle'); if (!h) return;
    const row = h.closest('.blk');
    drag = {from: row.dataset.p}; e.dataTransfer.setData('text/plain', 'move'); e.dataTransfer.setDragImage(row, 12, 12);
  });
  ws.addEventListener('dragend', () => { drag = null; clearMarks(); });
  ws.addEventListener('dragover', e => {
    if (!drag) return;
    e.preventDefault(); clearMarks();
    if (drag.type && BLOCKS[drag.type].hat) return;
    const scr = e.target.closest('.script'); if (!scr) return;
    const body = $('.sbody', scr), {kids, i} = dropIndex(body, e.clientY);
    if (kids[i]) kids[i].classList.add('dropb'); else body.classList.add('drope');
  });
  ws.addEventListener('drop', e => {
    if (!drag) return;
    e.preventDefault();
    const d = drag; drag = null;
    if (d.type && BLOCKS[d.type].hat) return addNew(d.type);
    const scr = e.target.closest('.script'); if (!scr) { clearMarks(); return; }
    const si = +scr.dataset.si; let {i} = dropIndex($('.sbody', scr), e.clientY);
    if (d.type) return addNew(d.type, si, i);
    const [fs, fb] = d.from.split('.').map(Number);
    const [b] = cur.scripts[fs].blocks.splice(fb, 1);
    if (fs === si && fb < i) i--;
    cur.scripts[si].blocks.splice(i, 0, b); selScript = si;
    save(); renderWorkspace();
  });
}

function setMode(mode) {
  const g = cur; if (g.mode === mode) return;
  const apply = () => { g.mode = mode; save(); renderEditor(); };
  if (mode === 'code') {
    if (!g.code || !g.codeEdited) { g.code = genCode(g.scripts); g.codeEdited = false; return apply(); }
    modal(`<div class="big">⌨️</div><h2 style="text-align:center">Which code do you want?</h2>
      <p style="text-align:center">You typed some code before. Keep it, or make fresh code from your blocks?</p>
      <div class="acts" style="justify-content:center"><button class="btn ghost" data-act="fresh">🧱 Fresh from my blocks</button><button class="btn" data-act="keep">Keep my typed code</button></div>`,
      {keep: apply, fresh: () => { g.code = genCode(g.scripts); g.codeEdited = false; apply(); }});
  } else if (g.codeEdited) {
    modal(`<div class="big">🧱</div><h2 style="text-align:center">Back to blocks?</h2>
      <p style="text-align:center">Blocks can't read typed code, so your blocks will be just how you left them. Your typed code is saved for when you come back.</p>
      <div class="acts" style="justify-content:center"><button class="btn ghost" data-act="x">Stay in code</button><button class="btn" data-act="ok">Go to blocks</button></div>`, {ok: apply});
  } else apply();
}

function finishGame() {
  const g = cur; if (g.finished) return;
  if (!g.beaten) return note('🏆', 'Beat your game first!', 'A finished game needs a way to win. Press ▶ Play and win your own game once.<br><span class="hint">Tip: use a 🏆 Game block like “if score reaches 10 → you win”.</span>', 'Got it');
  const reward = g.remixOf ? REMIX_REWARD : FINISH_REWARD;
  g.finished = true; addCoins(reward); beep('win'); renderEditor();
  modal(`<div class="big">🎉</div><h2 style="text-align:center">You finished ${esc(g.title)}!</h2>
    <p style="text-align:center">You earned <b>${reward} 🪙</b>. Want to put it in the Game Shop so other coders can buy it?</p>
    <div class="acts" style="justify-content:center"><button class="btn ghost" data-act="x">Not yet</button><button class="btn pink" data-act="pub">🚀 Publish it</button></div>`,
    {pub: () => { publishGame(); return false; }});
}

function publishGame() {
  const g = cur; if (!g || !g.finished) return;
  const m = modal(`<h2>🚀 Publish ${esc(g.title)}</h2>
    <label>Tell players about your game</label>
    <input type="text" id="pDesc" maxlength="80" placeholder="Catch all the stars!" value="${esc(g.desc || '')}">
    <label>Price: <span id="pLabel"></span></label>
    <input type="range" id="pPrice" min="0" max="${MAX_PRICE}" value="${g.price}">
    <div class="hint">You earn the price every time someone buys it. Cheaper games get bought more often!</div>
    <div class="acts">${g.published ? '<button class="btn ghost" data-act="un">Take it out of the shop</button>' : ''}
      <button class="btn ghost" data-act="x">Cancel</button><button class="btn pink" data-act="pub">${g.published ? 'Save' : '🚀 Publish'}</button></div>`,
    {
      pub: m => {
        const first = !g.published;
        g.desc = $('#pDesc', m).value.trim(); g.price = +$('#pPrice', m).value; g.published = true; save(); renderEditor();
        if (first) { beep('coin'); note('🚀', 'It is in the Game Shop!', `Other coders can now ${g.price ? `buy ${esc(g.title)} for ${g.price} 🪙` : `play ${esc(g.title)} for free`}. Watch your coins!`, 'Awesome'); return false; }
      },
      un: () => { g.published = false; save(); renderEditor(); toast('Taken out of the shop.'); }
    });
  const lab = () => { const v = +$('#pPrice', m).value; $('#pLabel', m).textContent = v ? `🪙 ${v}` : 'FREE'; };
  $('#pPrice', m).addEventListener('input', lab); lab();
}

/* Pretend other coders buy your published games while the page is open. */
setInterval(() => {
  if (!S.user) return;
  for (const g of S.games.filter(x => x.published)) {
    const chance = .3 * (1 - g.price / 45) / (1 + (g.sales || 0) / 12);
    if (Math.random() > chance) continue;
    const [name, av] = KIDS[Math.floor(Math.random() * KIDS.length)];
    g.sales = (g.sales || 0) + 1;
    if (g.price) { addCoins(g.price); beep('coin'); toast(`${av} ${name} bought ${g.title}! +${g.price} 🪙`); }
    else toast(`${av} ${name} is playing ${g.title}!`);
    save();
    if (view === 'shop' || view === 'make' || view === 'inv') { if (!curModal) render(); }
  }
}, 7000);

/* ---------------- clicks ---------------- */
const ACTIONS = {
  go: d => go(d.v),
  new: () => newGame(),
  edit: d => { cur = findGame(d.id); selScript = 0; go('editor'); },
  play: d => playGame(findGame(d.id)),
  buy: d => buyGame(findGame(d.id)),
  remix: d => newGame(findGame(d.id)),
  del: d => {
    const g = findGame(d.id);
    modal(`<div class="big">🗑️</div><h2 style="text-align:center">Delete ${esc(g.title)}?</h2><p style="text-align:center">It will be gone for good.</p>
      <div class="acts" style="justify-content:center"><button class="btn ghost" data-act="x">Keep it</button><button class="btn red" data-act="del">Delete</button></div>`,
      {del: () => { S.games = S.games.filter(x => x !== g); save(); render(); }});
  },
  mode: d => setMode(d.m),
  run: () => edStage && edStage.run(gameCode(cur)),
  stoprun: () => edStage && edStage.idle(),
  finish: finishGame,
  publish: publishGame,
  mute: () => { S.muted = !S.muted; save(); $('#muteBtn').textContent = S.muted ? '🔇' : '🔊'; },
  reset: () => modal(`<div class="big">🔄</div><h2 style="text-align:center">Start the demo over?</h2><p style="text-align:center">This erases your games, coins and nickname from this browser.</p>
      <div class="acts" style="justify-content:center"><button class="btn ghost" data-act="x">Cancel</button><button class="btn red" data-act="ok">Erase everything</button></div>`,
      {ok: () => { S = fresh(); save(); go('home'); }}),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled && !e.target.closest('.modal-bg') && ACTIONS[el.dataset.a]) ACTIONS[el.dataset.a](el.dataset);
});

render();
</script>
</body>
</html>
